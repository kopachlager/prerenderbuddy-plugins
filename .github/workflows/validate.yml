name: Validate plugins

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 20
          - 22
          - 24
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Validate shared plugin files
        run: npm test

      - name: Validate Cursor package with the official template validator
        run: |
          curl -fsSL https://raw.githubusercontent.com/cursor/plugin-template/46216072ac5750f782f95bb325b4d12b7c3ae9c9/scripts/validate-template.mjs --output "${RUNNER_TEMP}/cursor-validate-template.mjs"
          node "${RUNNER_TEMP}/cursor-validate-template.mjs"
